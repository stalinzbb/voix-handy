<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2b1a8f"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body inside a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Waveform bars whose lower ends trace a V -->
  <g fill="#fff">
    <rect x="252" y="300" width="72" height="200" rx="36"/>
    <rect x="364" y="300" width="72" height="310" rx="36"/>
    <rect x="476" y="300" width="72" height="424" rx="36"/>
    <rect x="588" y="300" width="72" height="310" rx="36"/>
    <rect x="700" y="300" width="72" height="200" rx="36"/>
  </g>
</svg>
